
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Li Lab</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background-color: #f3f5f8;
            margin: 0;
            padding: 60px 20px;
            color: #263746;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 55px 55px 35px;
            border: 1px solid #e2e7ee;
            border-radius: 8px;
            text-align: center;
        }

        h1 {
            color: #203b58;
            font-size: 32px;
            font-weight: 600;
            letter-spacing: 1px;
            margin: 0 0 15px;
        }

        .title-line {
            width: 46px;
            height: 2px;
            background-color: #284f73;
            margin: 0 auto 15px;
        }

        .subtitle {
            color: #758293;
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 35px;
        }

        .divider {
            border: none;
            border-top: 1px solid #e2e7ee;
            margin: 0;
        }

        .notice {
            color: #4b5a6b;
            font-size: 15px;
            line-height: 1.8;
            margin: 35px 0 30px;
        }

        .link-button {
            display: block;
            background-color: #284f73;
            color: #ffffff;
            text-decoration: none;
            padding: 16px 20px;
            margin: 0 auto 40px;
            border-radius: 5px;
            max-width: 420px;
            font-size: 16px;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .link-button:hover {
            background-color: #193a57;
        }

        .footer {
            padding-top: 25px;
            color: #8a95a3;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            body {
                padding: 25px 15px;
            }

            .container {
                padding: 40px 22px 25px;
            }

            h1 {
                font-size: 28px;
            }

            .notice {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <h1>Li Lab</h1>
        <div class="title-line"></div>

        <hr class="divider">

        <div class="notice">
            本页面仅供课题组内部使用，请勿修改他人填写内容或向外传播。
        </div>

        <a class="link-button"
           href="https://docs.qq.com/sheet/DRmJDTURqek1FVFhC?tab=BB08J2"
           target="_blank"
           rel="noopener noreferrer">
            订购登记表 ↗
        </a>

        <hr class="divider">

        <div class="footer">
            © Li Lab
        </div>

    </main>
</body>
</html>
