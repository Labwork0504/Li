<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duan Lab</title>

    <style>
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 40px;
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .notice {
            color: #c0392b;
            font-size: 18px;
            margin-bottom: 35px;
            font-weight: bold;
        }

        .link-button {
            display: block;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            padding: 15px;
            margin: 12px auto;
            border-radius: 10px;
            width: 70%;
            font-size: 18px;
            transition: 0.3s;
        }

        .link-button:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 30px;
            color: #888;
            font-size: 14px;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>Li Lab</h1>

    <div class="notice">
        仅供课题组内部使用，勿改动他人文本，勿外传
