
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Li Lab</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background-color: #f3f5f8;
            margin: 0;
            padding: 60px 20px;
            color: #263746;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 55px 55px 35px;
            border: 1px solid #e2e7ee;
            border-radius: 8px;
            text-align: center;
        }

        .title-wrapper {
            display: inline-block;
            margin-bottom: 35px;
        }

        h1 {
            color: #203b58;
            font-size: 32px;
            font-weight: 600;
            letter-spacing: 1px;
            margin: 0 0 15px;
        }

        .title-line {
            width: 100%;
            height: 2px;
            background-color: #284f73;
        }

        .divider {
            border: none;
            border-top: 1px solid #e2e7ee;
            margin: 0;
        }

        .notice {
            color: #4b5a6b;
            font-size: 15px;
            line-height: 1.8;
            margin: 35px 0 30px;
        }

        .link-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #284f73;
            color: #ffffff;
            text-decoration: none;
            padding: 16px 20px;
            margin: 0 auto 15px;
            border-radius: 5px;
            max-width: 420px;
            font-size: 16px;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .link-button:hover {
            background-color: #193a57;
        }

        .link-button:last-of-type {
            margin-bottom: 40px;
        }

        .button-icon {
            width: 19px;
            height: 19px;
            flex-shrink: 0;
            stroke: currentColor;
            stroke-width: 1.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .footer {
            padding-top: 25px;
            color: #8a95a3;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            body {
                padding: 25px 15px;
            }

            .container {
                padding: 40px 22px 25px;
            }

            h1 {
                font-size: 28px;
            }

            .notice {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <div class="title-wrapper">
            <h1>Li Lab</h1>
            <div class="title-line"></div>
        </div>

        <hr class="divider">

        <div class="notice">
             <em>For Participants’ Internal Use Only—Do Not Share Without Li Lab’s Permission</em>
        </div>

        <!-- 订购登记表 -->
        <a class="link-button"
           href="https://docs.qq.com/sheet/DRmJDTURqek1FVFhC?tab=BB08J2"
           target="_blank"
           rel="noopener noreferrer">

            <svg class="button-icon" viewBox="0 0 24 24"
                 aria-hidden="true">
                <rect x="5" y="4" width="14" height="17" rx="2"/>
                <path d="M9 4.5V3h6v1.5"/>
                <path d="M9 10h6"/>
                <path d="M9 14h6"/>
                <path d="M9 18h4"/>
            </svg>

            <span>订购登记表</span>
        </a>

        <!-- 小鼠订购表 -->
        <a class="link-button"
           href="https://docs.qq.com/sheet/DRnFqVW9mU0hTREJu?tab=BB08J2"
           target="_blank"
           rel="noopener noreferrer">

            <svg class="button-icon" viewBox="0 0 24 24"
                 aria-hidden="true">
                <path d="M8 9C6 6 3 7 3 10c0 2 2 3 4 3"/>
                <path d="M16 9c2-3 5-2 5 1 0 2-2 3-4 3"/>
                <path d="M5 14c0-5 3-8 7-8s7 3 7 8-3 7-7 7-7-2-7-7z"/>
                <circle cx="9" cy="13" r="0.8" fill="currentColor" stroke="none"/>
                <circle cx="15" cy="13" r="0.8" fill="currentColor" stroke="none"/>
                <path d="M11 17l1 1 1-1"/>
                <path d="M5 17l-3 1"/>
                <path d="M19 17l3 1"/>
            </svg>

            <span>小鼠订购表</span>
        </a>

        <hr class="divider">

        <div class="footer">
            © Li Lab
        </div>

    </main>
</body>
</html>
